name: Build TimescaleDB extension image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - images/timescaledb/**
      - .github/workflows/timescaledb.yml

env:
  IMAGE: ghcr.io/openshock/timescaledb
  TIMESCALEDB_VERSION: 2.31.0
  PG_MAJOR: 18
  DEBIAN_RELEASE: trixie

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: images/timescaledb
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE=ghcr.io/cloudnative-pg/postgresql:${{ env.PG_MAJOR }}-minimal-${{ env.DEBIAN_RELEASE }}
            PG_MAJOR=${{ env.PG_MAJOR }}
            TIMESCALEDB_VERSION=${{ env.TIMESCALEDB_VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.TIMESCALEDB_VERSION }}-${{ env.PG_MAJOR }}-${{ env.DEBIAN_RELEASE }}
          push: true
