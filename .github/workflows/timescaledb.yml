name: Build TimescaleDB extension image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - images/timescaledb/**
      - .github/workflows/timescaledb.yml

env:
  IMAGE: ghcr.io/openshock/timescaledb
  TIMESCALEDB_VERSION: 2.32.1
  PG_MAJOR: 18
  DEBIAN_RELEASE: trixie

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/timescaledb
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE=ghcr.io/cloudnative-pg/postgresql:${{ env.PG_MAJOR }}-minimal-${{ env.DEBIAN_RELEASE }}
            PG_MAJOR=${{ env.PG_MAJOR }}
            TIMESCALEDB_VERSION=${{ env.TIMESCALEDB_VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.TIMESCALEDB_VERSION }}-${{ env.PG_MAJOR }}-${{ env.DEBIAN_RELEASE }}
          push: true
