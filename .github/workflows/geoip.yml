name: Build GeoIP image

on:
  # MaxMind publishes GeoLite2 updates on Tuesdays and Fridays.
  schedule:
    - cron: '0 6 * * 3,6'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - images/geoip/**
      - .github/workflows/geoip.yml

env:
  IMAGE: ghcr.io/openshock/geoip

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download GeoLite2 databases
        working-directory: images/geoip
        run: |
          mkdir -p data
          docker run --rm \
            -e GEOIPUPDATE_ACCOUNT_ID="${{ secrets.MAXMIND_ACCOUNT_ID }}" \
            -e GEOIPUPDATE_LICENSE_KEY="${{ secrets.MAXMIND_LICENSE_KEY }}" \
            -e GEOIPUPDATE_EDITION_IDS="GeoLite2-ASN GeoLite2-City" \
            -e GEOIPUPDATE_DB_DIR=/data \
            -v "$PWD/data:/data" \
            ghcr.io/maxmind/geoipupdate:v7
          mv data/*.mmdb . && ls -la

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        working-directory: images/geoip
        run: |
          TAG="$(date -u +%Y%m%d)"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Each version is ~70MB; keep a few for rollback and drop the rest.
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: geoip
          package-type: container
          min-versions-to-keep: 4
